<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PO Timeframes — тест разметки PO</title>
  <style>
    body { background: #0e131c; color: #ccc; font-family: sans-serif; margin: 0; }
    .chart-area { position: relative; height: 70vh; background: #151a24; margin: 20px; }
    .items { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
    .items__link { display: inline-flex; align-items: center; padding: 4px 8px; background: #2a3140; color: #fff; cursor: pointer; border-radius: 4px; text-decoration: none; position: relative; }
    .counter__icon { font-size: 11px; background: #4285f4; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
    .drop-down-modal { position: absolute; top: 48px; left: 12px; background: #1e2430; padding: 12px; border-radius: 8px; display: none; min-width: 320px; z-index: 10; }
    .drop-down-modal.open { display: block; }
    .drop-down-modal h4 { margin: 12px 0 8px; font-size: 12px; color: #888; }
    .interval-items { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .interval-items .items__link { justify-content: center; padding: 8px; }
    .interval-items .items__link.active { background: #4285f4; }
    canvas { width: 100%; height: 100%; display: block; }
    #status { padding: 12px 20px; }
  </style>
</head>
<body>
  <div id="status">Текущий TF: M1</div>
  <div class="chart-area">
    <div class="items">
      <a class="items__link items__link--chart-type" id="chart-toggle" href="#">
        <span>🕯</span>
        <span class="counter__icon" id="tf-badge">M1</span>
      </a>
      <a class="items__link items__link--indicators" href="#">📊</a>
    </div>
    <div class="drop-down-modal" id="chart-dropdown">
      <div>Типы графика: Свечи</div>
      <h4>Интервал</h4>
      <div class="interval-items items">
        <a class="items__link active" href="#" data-period="60">M1</a>
        <a class="items__link" href="#" data-period="300">M5</a>
        <a class="items__link" href="#" data-period="900">M15</a>
      </div>
    </div>
    <canvas></canvas>
  </div>
  <script>
    const dropdown = document.getElementById("chart-dropdown");
    const badge = document.getElementById("tf-badge");
    const status = document.getElementById("status");
    document.getElementById("chart-toggle").addEventListener("click", (e) => {
      e.preventDefault();
      dropdown.classList.toggle("open");
    });
    dropdown.querySelectorAll(".interval-items .items__link").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        dropdown.querySelectorAll(".interval-items .items__link").forEach((x) => x.classList.remove("active"));
        a.classList.add("active");
        const tf = a.textContent.trim();
        badge.textContent = tf;
        status.textContent = "Текущий TF: " + tf;
        dropdown.classList.remove("open");
      });
    });
  </script>
</body>
</html>
