<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PocketOption Timeframes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 14px 16px;
      min-width: 340px;
      max-width: 420px;
      background: #1a1d24;
      color: #e8eaed;
      font-size: 13px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .subtitle {
      margin: 0 0 12px;
      color: #9aa0a6;
      font-size: 12px;
      line-height: 1.4;
    }
    .rows {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: grid;
      grid-template-columns: 72px 72px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      background: #22262f;
      border: 1px solid #2d323c;
    }
    .row-label {
      font-weight: 600;
      color: #8ab4f8;
      font-size: 12px;
    }
    .row select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #3c4450;
      background: #1a1d24;
      color: #e8eaed;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .key-btn {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #3c4450;
      background: #2a2f3a;
      color: #e8eaed;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .key-btn:hover {
      border-color: #5a95f5;
    }
    .key-btn.recording {
      border-color: #81c995;
      box-shadow: 0 0 0 1px rgba(129, 201, 149, 0.45);
      color: #81c995;
    }
    .hint {
      margin-top: 12px;
      color: #9aa0a6;
      line-height: 1.45;
      font-size: 12px;
    }
    code {
      color: #8ab4f8;
      font-size: 11px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    #save {
      background: #4285f4;
      color: #fff;
    }
    #save:hover {
      background: #5a95f5;
    }
    #reset {
      background: #2a2f3a;
      color: #e8eaed;
      border: 1px solid #3c4450;
    }
    #reset:hover {
      border-color: #5a95f5;
    }
    .ok {
      color: #81c995;
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <h1>Таймфреймы PocketOption</h1>
  <p class="subtitle">
    Для каждой кнопки выберите таймфрейм и сочетание клавиш.
    Настройки применяются сразу на вкладке PO.
  </p>

  <div class="rows" id="rows"></div>

  <div class="actions">
    <button type="button" id="save">Сохранить</button>
    <button type="button" id="reset">Сбросить</button>
  </div>
  <div class="ok" id="status"></div>

  <p class="hint">
    Alt+1…4 также работают через <code>chrome://extensions/shortcuts</code>
    (берут таймфрейм из кнопок 1–4).
    Клик по полю клавиши → нажмите новое сочетание (Esc — отмена).
  </p>

  <script src="shortcuts-config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
