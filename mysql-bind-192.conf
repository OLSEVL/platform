# Разрешить подключения к MySQL по сети (в т.ч. 192.168.1.10).
# Установка (файл должен загружаться после mysqld.cnf, поэтому имя с z-):
#   sudo cp /home/o/platform/mysql-bind-192.conf /etc/mysql/mysql.conf.d/z-bind-address.cnf
#   sudo systemctl restart mysql
# Пользователь для удалённого доступа (один раз):
#   sudo mysql -e "CREATE USER IF NOT EXISTS 'platform'@'%' IDENTIFIED BY 'platform'; GRANT ALL ON platform.* TO 'platform'@'%'; FLUSH PRIVILEGES;"

[mysqld]
bind-address = 0.0.0.0
mysqlx-bind-address = 0.0.0.0
