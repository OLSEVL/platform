# Nginx для Laravel platform
# Размещение: /etc/nginx/sites-available/platform
# Включение: ln -sf /etc/nginx/sites-available/platform /etc/nginx/sites-enabled/

# Если порт 80 свободен — раскомментируйте listen 80 и закомментируйте listen 8080
server {
    # listen 80 default_server;
    # listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    # Внешний доступ плагина/сайта: A-запись bot123456789.space → WAN IP, на роутере проброс TCP 8080.
    server_name bot123456789.space www.bot123456789.space localhost _;

    root /home/o/platform/public;
    index index.php;

    charset utf-8;

    # Учебные HTML/JS в docs_need_release — не кэшировать (иначе удалённые ПК видят старую версию)
    location ~* ^/docs_need_release/.*\.(html|js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Ingest с proxy идёт в отдельный php-fpm pool `ingest`, иначе 5 воркеров www
    # залипают на POST /api/ingest-* и графики/страницы не открываются (HTTP 499).
    location = /api/ingest-current-candle {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-ingest.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/ingest-current.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 20;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location = /api/ingest-candles {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-ingest.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location = /api/ingest-payout {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm-ingest.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    # PR2: chart live hub (Redis chart:s5 → browser WS). platform-chart-live.service :8765
    location /chart-live {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Chrome-расширение: сигналы ботов (тот же hub, путь /extension-live + статический токен).
    location /extension-live {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
