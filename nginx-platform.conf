# Nginx для Laravel platform
# Размещение: /etc/nginx/sites-available/platform
# Включение: ln -sf /etc/nginx/sites-available/platform /etc/nginx/sites-enabled/

# Если порт 80 свободен — раскомментируйте listen 80 и закомментируйте listen 8080
server {
    # listen 80 default_server;
    # listen [::]:80 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name bot13123.online www.bot13123.online localhost _;

    root /root/platform/public;
    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
