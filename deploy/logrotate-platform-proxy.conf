# Ротация лога pocket-options-proxy (systemd StandardOutput=append → storage/logs/proxy.log).
# Установка: sudo cp deploy/logrotate-platform-proxy.conf /etc/logrotate.d/platform-proxy
# Принудительно (если файл уже раздут): sudo logrotate -f /etc/logrotate.d/platform-proxy
#
# copytruncate обязателен: процесс держит открытый fd на файл, move/rename не подхватит новый лог.

/home/o/platform/storage/logs/proxy.log {
    daily
    size 100M
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su o o
}
