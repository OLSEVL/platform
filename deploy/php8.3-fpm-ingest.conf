; Ingest pool: proxy POST /api/ingest-* не должен забивать пул www (графики/страницы).
; Копировать в /etc/php/8.3/fpm/pool.d/ingest.conf и перезапустить php8.3-fpm.
[ingest]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm-ingest.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 10s
pm.max_requests = 1000
request_terminate_timeout = 20
catch_workers_output = yes
php_admin_value[memory_limit] = 128M
